<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image → CAD</title>
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
<div id="loading"><div id="ltxt">Loading…</div><div class="bar"><i id="lbar"></i></div></div>
<div id="app">
<header>
  <h1>Image → CAD <small>picture to parametric, jointed, printable 3D model</small></h1><select id="exsel" class="btn" title="Example designs"></select>
  <button class="btn mob" id="bLeft">Parts</button>
  <div class="seg" id="views">
    <button class="btn" data-v="iso">Iso</button><button class="btn" data-v="front">Front</button><button class="btn" data-v="right">Right</button><button class="btn" data-v="top">Top</button><button class="btn" data-v="back">Back</button>
  </div>
  <button class="btn" id="bFit">Fit</button>
  <div class="seg" id="navMode" title="How dragging on the model works">
    <button class="btn on" data-nav="orbit">Orbit</button>
    <button class="btn" data-nav="pan">Pan view</button>
    <button class="btn" data-nav="move">Move model</button>
  </div>
  <div class="seg" id="movePlane" title="Plane to slide the model on" style="display:none">
    <button class="btn on" data-plane="xy">Floor XY</button>
    <button class="btn" data-plane="xz">Front XZ</button>
    <button class="btn" data-plane="yz">Side YZ</button>
  </div>
  <label style="display:flex;gap:6px;align-items:center;margin-left:6px">Explode <input type="range" id="exs" min="0" max="1" step="0.01" value="0" style="width:110px"></label>
  <select id="cmode" class="btn" title="Colour mode"><option value="real">Realistic wood</option><option value="group">By subassembly</option><option value="xray">X-ray</option></select>
  <button class="btn" id="bEdge">Edges</button>
  <button class="btn" id="bSec">Section</button>
  <button class="btn" id="bMeas">Measure</button>
  <div class="sp"></div>
  <button class="btn pri" id="bAI" title="Generate from a picture or revise with a prompt">AI design</button>
  <button class="btn" id="bBom">Cut list</button><button class="btn" id="bGuide">Build guide</button>
  <button class="btn" id="bExp">Export STL</button>
  <button class="btn mob" id="bRight">Panel</button>
</header>
<main>
  <aside id="left">
    <div id="tfilter"><input type="search" id="tq" placeholder="Search parts…"><button class="btn sm" id="bShowAll" title="Show everything">All</button></div>
    <div id="tree"></div>
  </aside>
  <div id="vpwrap">
    <button class="edgebtn" id="edgeL" title="Hide or show the parts list">‹</button>
    <canvas id="cv" tabindex="0"></canvas>
    <div class="hud" id="hudTL"></div><div class="hud" id="hudTR"></div><div class="hud" id="hudBL"></div>
    <div id="tip"></div><div id="mlabel"></div>
    <button class="edgebtn right" id="edgeR" title="Hide or show the inspector">›</button>
  </div>
  <aside id="right">
    <div class="tabs"><button data-t="insp" class="on">Inspect</button><button data-t="motion">Move</button><button data-t="param">Design</button><button data-t="export">Export</button><button data-t="review">Review</button><button data-t="spec">Spec</button></div>
    <div class="pane on" id="p-insp"></div>
    <div class="pane" id="p-motion"></div>
    <div class="pane" id="p-param"></div>
    <div class="pane" id="p-export"></div>
    <div class="pane" id="p-review"></div>
    <div class="pane" id="p-spec"></div>
  </aside>
</main>
<footer>
  <button class="btn sm" id="bPlay">▶ Assemble</button>
  <button class="btn sm" id="bStepAll">Show all</button>
  <div id="steps"></div>
  <div id="stepTxt"></div>
</footer>
</div>
<div id="modal"><div class="box"><div class="mh"><b id="mtitle"></b><div class="sp"></div><span id="mextra"></span><button class="btn sm" id="mcsv">Download CSV</button><button class="btn sm" id="mclose">Close</button></div><div class="mb" id="mbody"></div></div></div>
<div id="aiBox"><div class="aih"><b>AI</b><span id="aiConn" class="aiConn">Checking connection…</span><div class="sp"></div><button class="btn sm" id="aiClose">Close</button></div><div class="aib" id="p-ai"></div></div>
<div id="guide"><div class="gh"><button class="btn pri" id="gclose">← Back to model</button><b>Build guide</b><span id="gprog" style="color:#6b7788"></span><div class="sp"></div><select id="gsel" class="btn"></select><button class="btn sm" id="gprev">◀ Previous step</button><button class="btn pri sm" id="gnext">Next step ▶</button><button class="btn sm" id="gall">All pages</button><button class="btn sm" id="gsave">Save guide (HTML)</button><button class="btn sm" id="gprint">Print / PDF</button></div><div class="gb" id="gbody"></div><div class="gstep"><button class="btn" id="gprev2">◀ Previous</button><button class="btn pri" id="gnext2">Next step ▶</button></div></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="src/core/geo.js"></script>
<script src="src/core/units.js"></script>
<script src="src/core/csg.js"></script>
<script src="src/core/checks.js"></script>
<script src="src/core/spec.js"></script>
<script src="src/core/exporter.js"></script>
<script src="src/ai/vision.js"></script>
<script src="src/ui/guide.js"></script>
<script src="src/ui/app.js"></script>
</body>
</html>
